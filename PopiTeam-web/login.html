<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopiTeam — Iniciar sesión</title>
    <link rel="icon" href="Fotos/popiteam.jpg">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="tarjeta.css">
</head>
<body>

<header class="barra barra--simple">
    <div class="barra__principal">
        <a href="pagina1.html" class="marca">
            <img class="marca__imagen" src="Fotos/popiteam.jpg" alt="Escudo PopiTeam">
            <span class="marca__nombre">PopiTeam<span>Iniciar sesión</span></span>
        </a>
        <div class="barra__acciones">
            <div class="acciones-usuario">
                <a class="icono" href="login.html" aria-label="Perfil">👤</a>
                <a class="icono carrito" href="carrito.html" aria-label="Carrito">🛒<span>0</span></a>
            </div>
        </div>
    </div>
</header>

<main class="contenedor-pagina">
    <section class="tarjeta" aria-label="Formulario de inicio de sesión">
        <header class="tarjeta__barra">
            <a class="boton-icono" href="pagina1.html" aria-label="Volver">&#8592;</a>
            <h1>Iniciar sesión</h1>
        </header>

        <div class="tarjeta__cuerpo">
            <div class="introduccion">
                <h2>Ingresá a tu cuenta</h2>
                <p>Necesitás iniciar sesión para poder comprar en la tienda o sacar entradas.</p>
            </div>

            <form class="formulario" id="formularioLogin">
                <label class="campo campo--full">
                    <span>Correo electrónico</span>
                    <input type="email" name="correo" placeholder="Ingresá tu correo" required>
                </label>

                <label class="campo campo--full">
                    <span>Contraseña</span>
                    <input type="password" name="contrasena" placeholder="Ingresá tu contraseña" required>
                </label>

                <p class="mensaje-formulario" id="mensajeLogin" aria-live="polite"></p>
            </form>
            <p class="mensaje-formulario">¿No tenés cuenta? <a href="asociarseP1.html">Registrate acá</a></p>
        </div>

        <footer class="tarjeta__pie">
            <button type="submit" form="formularioLogin" id="botonIngresar" class="is-active">Ingresar</button>
        </footer>
    </section>
</main>

<script src="sesion.js"></script>
<script>
    const formulario = document.getElementById('formularioLogin');
    const mensaje = document.getElementById('mensajeLogin');

    formulario.addEventListener('submit', function (event) {
        event.preventDefault();
        mensaje.textContent = '';
        iniciarSesion(formulario.correo.value, formulario.contrasena.value).then(function (res) {
            if (res.ok) {
                const params = new URLSearchParams(window.location.search);
                const volver = params.get('volver');
                window.location.href = volver ? volver : 'pagina1.html';
            } else {
                mensaje.textContent = res.mensaje || 'No se pudo iniciar sesión.';
                mensaje.style.color = '#c0392b';
            }
        });
    });

    // Si ya hay una sesión iniciada, avisamos en vez de pedir loguearse de nuevo
    const sesionActual = obtenerSesion();
    if (sesionActual) {
        mensaje.textContent = 'Ya iniciaste sesión como ' + sesionActual.nombre + '.';
        mensaje.style.color = 'var(--gold-600)';
    }
</script>

</body>
</html>
