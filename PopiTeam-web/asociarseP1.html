<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PopiTeam — Asociarse</title>
	<link rel="icon" href="Fotos/popiteam.jpg">
	<link rel="stylesheet" href="estilos.css">
	<link rel="stylesheet" href="tarjeta.css">
</head>
<body>

<header class="barra barra--simple">
    <div class="barra__principal">
        <a href="pagina1.html" class="marca">
            <img class="marca__imagen" src="Fotos/popiteam.jpg" alt="Escudo PopiTeam">
            <span class="marca__nombre">PopiTeam<span>Socios</span></span>
        </a>
        <div class="barra__acciones">
            <div class="acciones-usuario">
                <a class="acciones-usuario__texto" href="login.html">Iniciar sesión o registrarse</a>
                <a class="icono" href="login.html" aria-label="Perfil">👤</a>
                <a class="icono carrito" href="carrito.html" aria-label="Carrito">🛒<span>0</span></a>
            </div>
        </div>
    </div>
</header>

<main class="contenedor-pagina">
	<section class="tarjeta" aria-label="Formulario de asociarse">
		<header class="tarjeta__barra">
			<a class="boton-icono" href="pagina1.html" aria-label="Volver">&#8592;</a>
			<h1>Asociarse — Paso 1 de 2</h1>
		</header>

		<div class="tarjeta__cuerpo">
			<div class="introduccion">
				<h2>Tus datos</h2>
				<p>Ingresá tus datos personales para comenzar el formulario de asociación.</p>
			</div>

			<form class="formulario">
				<label class="campo campo--full">
					<span>Nombre</span>
					<input type="text" name="nombre" placeholder="Nombre" required>
				</label>

				<label class="campo campo--full">
					<span>Apellido</span>
					<input type="text" name="apellido" placeholder="Apellido" required>
				</label>

				<label class="campo campo--full">
					<span>DNI</span>
					<input type="text" name="dni" inputmode="numeric" pattern="[0-9]{7,8}" placeholder="Sin puntos" required>
				</label>

				<label class="campo campo--full">
					<span>Fecha de nacimiento</span>
					<input type="date" name="fecha_nacimiento" required>
				</label>

				<label class="campo campo--full">
					<span>Teléfono</span>
					<input type="tel" name="telefono" placeholder="Ej: 11 2345 6789" required>
				</label>

				<label class="campo campo--full">
					<span>Correo electrónico</span>
					<input type="email" name="correo" placeholder="Ingresá tu correo" required>
				</label>

				<label class="campo campo--full">
					<span>Contraseña</span>
					<input type="password" name="contrasena" placeholder="Creá una contraseña (mínimo 8 caracteres)" minlength="8" required>
				</label>

				<label class="campo campo--full">
					<span>Repetí tu contraseña</span>
					<input type="password" name="repetir_contrasena" placeholder="Repetí tu contraseña" required>
				</label>

				<p class="mensaje-formulario" id="mensajeFormulario" aria-live="polite"></p>
			</form>
		</div>

		<footer class="tarjeta__pie">
			<button type="submit" form="formularioAsociarse" disabled>Siguiente</button>
		</footer>
	</section>
</main>

<script src="sesion.js"></script>
<script>
	const form = document.querySelector('.formulario');
	const button = document.querySelector('.tarjeta__pie button');
	const password = form.elements.contrasena;
	const repeatPassword = form.elements.repetir_contrasena;

	form.id = 'formularioAsociarse';

	function updateState() {
		const filled = form.nombre.value.trim() && form.apellido.value.trim() && form.dni.value.trim() && form.fecha_nacimiento.value && form.telefono.value.trim() && form.correo.value.trim() && password.value.trim() && repeatPassword.value.trim();
		const matches = password.value === repeatPassword.value;
		const valid = filled && matches && form.checkValidity();

		button.disabled = !valid;
		button.classList.toggle('is-active', valid);
	}

	form.addEventListener('input', updateState);
	form.addEventListener('submit', function (event) {
		event.preventDefault();
		if (button.disabled) {
			return;
		}
		button.disabled = true;
		enviarPHP('php/registro.php', {
			nombre: form.nombre.value,
			apellido: form.apellido.value,
			dni: form.dni.value,
			fecha_nacimiento: form.fecha_nacimiento.value,
			telefono: form.telefono.value,
			email: form.correo.value,
			contrasena: password.value
		}).then(function (res) {
			if (res.datos.ok) {
				guardarSesionLocal(res.datos.correo, res.datos.nombre);
				window.location.href = 'asociarseP2.html';
			} else {
				const msg = document.getElementById('mensajeFormulario');
				msg.textContent = res.datos.mensaje || 'No se pudo crear la cuenta.';
				msg.style.color = '#c0392b';
				updateState();
			}
		});
	});

	updateState();
</script>
</body>
</html>
