<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopiTeam — Comprobante</title>
    <link rel="icon" href="Fotos/popiteam.jpg">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="tarjeta.css">
</head>
<body>
<header class="barra barra--simple">
    <div class="barra__principal">
        <a href="pagina1.html" class="marca">
            <img class="marca__imagen" src="Fotos/popiteam.jpg" alt="Escudo PopiTeam">
            <span class="marca__nombre">PopiTeam<span>Entradas</span></span>
        </a>
        <nav class="enlaces-nav">
            <a href="comprarE.html">COMPRAR ENTRADAS</a>
            <a href="asistencia.html">ASISTENCIA</a>
            <a href="socio.html">SOCIO</a>
        </nav>
        <div class="barra__acciones">
            <div class="acciones-usuario">
                <a class="icono" href="login.html" aria-label="Perfil">👤</a>
                <a class="icono carrito" href="carrito.html" aria-label="Carrito">🛒<span>0</span></a>
            </div>
        </div>
    </div>
</header>

<main class="contenedor-pagina">
    <section class="tarjeta" aria-label="Comprobante de compra">
        <header class="tarjeta__barra">
            <a class="boton-icono" href="pagina1.html" aria-label="Volver">&#8592;</a>
            <h1>Comprobante</h1>
        </header>

        <div class="tarjeta__cuerpo">
            <p id="mensajeComprobante">Cargando comprobante...</p>
            <div class="detalle-comprobante" hidden id="detalleComprobante">
                <p id="filaPartido"><strong id="etiquetaPartido">Partido:</strong> <span id="partidoComprobante"></span></p>
                <p><strong>Comprador:</strong> <span id="nombreComprobante"></span></p>
                <p><strong id="etiquetaCantidad">Entradas:</strong> <span id="cantidadComprobante"></span></p>
                <p><strong>Total pagado:</strong> $<span id="totalComprobante"></span></p>
            </div>
        </div>

        <footer class="tarjeta__pie">
            <a class="btn-footer is-active" href="socio.html">Volver</a>
        </footer>
    </section>
</main>

<script src="sesion.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const partidoComprobante = document.getElementById('partidoComprobante');
    const nombreComprobante = document.getElementById('nombreComprobante');
    const cantidadComprobante = document.getElementById('cantidadComprobante');
    const totalComprobante = document.getElementById('totalComprobante');
    const mensajeComprobante = document.getElementById('mensajeComprobante');
    const detalleComprobante = document.getElementById('detalleComprobante');

    const match = params.get('match');
    const qty = params.get('qty');
    const name = params.get('name');
    const total = params.get('total');

    const labels = {
        'popiteam-vs-kataki': 'PopiTeam vs Kataki'
    };

    const etiquetaPartido = document.getElementById('etiquetaPartido');
    const etiquetaCantidad = document.getElementById('etiquetaCantidad');
    const filaPartido = document.getElementById('filaPartido');

    if (match === 'tienda-popiteam') {
        filaPartido.hidden = true;
        etiquetaCantidad.textContent = 'Productos:';
    } else {
        partidoComprobante.textContent = labels[match] || 'PopiTeam vs River Plate';
    }

    nombreComprobante.textContent = name ? decodeURIComponent(name) : '';
    cantidadComprobante.textContent = qty || '0';
    totalComprobante.textContent = total || '0';

    mensajeComprobante.textContent = qty ? '¡Gracias por tu compra!' : 'No encontramos datos de compra.';
    detalleComprobante.hidden = false;
</script>

</body>
</html>
