<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopiTeam — Mi Carnet de Socio</title>
    <link rel="icon" href="Fotos/popiteam.jpg">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="socio.css">
</head>
<body>
    <header class="barra barra--simple">
        <div class="barra__principal">
            <a href="pagina1.html" class="marca">
                <img class="marca__imagen" src="Fotos/popiteam.jpg" alt="Escudo PopiTeam">
                <span class="marca__nombre">PopiTeam<span>Socios</span></span>
            </a>
            <nav class="enlaces-nav">
                <a href="comprarE.html">COMPRAR ENTRADAS</a>
                <a href="asistencia.html">ASISTENCIA</a>
                <a href="socio.html" class="is-current">SOCIO</a>
            </nav>
            <div class="barra__acciones">
                <div class="acciones-usuario">
                    <a class="icono" href="login.html" aria-label="Perfil">👤</a>
                    <a class="icono carrito" href="carrito.html" aria-label="Carrito">🛒<span>0</span></a>
                </div>
            </div>
        </div>
    </header>

    <main class="match-poster">
        <span class="socio-badge">⭐ Socio activo</span>

        <section class="match-tarjeta" aria-label="Partido destacado">
            <div class="team team--left">
                <img src="Fotos/popiteam.jpg" alt="Escudo del PopiTeam">
                <span>POPITEAM</span>
            </div>

            <div class="match-card__divider" aria-hidden="true"></div>

            <div class="team team--right">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQC5isQ3QPD5k0eahi1tj-jp7QwmRo6GdMqTg-nNzqbOQ&s" alt="River Plate">
                <span>River Plate</span>
            </div>
        </section>

        <div class="match-info" aria-label="Información del partido">
            <p>El partido va a ser el día 17/07 a las 21:00 hs en el Estadio Popi.</p>
        </div>

        <div class="tickets-cta">
            <a class="btn btn--gold" href="comprarE.html">Comprar entradas</a>
        </div>
    </main>
<script src="sesion.js"></script>
</body>
</html>
