<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopiTeam — Registrar administrador</title>
    <link rel="icon" href="Fotos/popiteam.jpg">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="tarjeta.css">
</head>
<body>

<header class="barra barra--simple">
    <div class="barra__principal">
        <a href="pagina1.html" class="marca">
            <img class="marca__imagen" src="Fotos/popiteam.jpg" alt="Escudo PopiTeam">
            <span class="marca__nombre">PopiTeam<span>Administración</span></span>
        </a>
    </div>
</header>

<main class="contenedor-pagina">
    <section class="tarjeta" aria-label="Registro de administrador">
        <header class="tarjeta__barra">
            <a class="boton-icono" href="login.html" aria-label="Volver">&#8592;</a>
            <h1>Registrar administrador</h1>
        </header>

        <div class="tarjeta__cuerpo">
            <div class="introduccion">
                <h2>Datos del administrador</h2>
                <p>Si todavía no hay ningún administrador, este formulario crea el primero. Después solo puede usarlo un administrador con sesión iniciada.</p>
            </div>

            <form class="formulario" id="formularioAdmin" novalidate>
                <label class="campo campo--full">
                    <span>Nombre</span>
                    <input type="text" name="nombre" maxlength="50" placeholder="Nombre" required>
                </label>

                <label class="campo campo--full">
                    <span>Apellido</span>
                    <input type="text" name="apellido" maxlength="50" placeholder="Apellido" required>
                </label>

                <label class="campo campo--full">
                    <span>DNI</span>
                    <input type="text" name="dni" inputmode="numeric" placeholder="Sin puntos" required>
                </label>

                <label class="campo campo--full">
                    <span>Fecha de nacimiento</span>
                    <input type="date" name="fecha_nacimiento" required>
                </label>

                <label class="campo campo--full">
                    <span>Teléfono</span>
                    <input type="tel" name="telefono" placeholder="Ej: 11 2345 6789" required>
                </label>

                <label class="campo campo--full">
                    <span>Correo electrónico</span>
                    <input type="email" name="correo" placeholder="Correo del administrador" required>
                </label>

                <label class="campo campo--full">
                    <span>Contraseña</span>
                    <input type="password" name="contrasena" maxlength="14" placeholder="Entre 8 y 14 caracteres" required>
                </label>

                <label class="campo campo--full">
                    <span>Repetí la contraseña</span>
                    <input type="password" name="repetir_contrasena" maxlength="14" placeholder="Repetí la contraseña" required>
                </label>

                <p class="mensaje-formulario" id="mensajeAdmin" aria-live="polite"></p>
            </form>
        </div>

        <footer class="tarjeta__pie">
            <button type="submit" form="formularioAdmin" id="botonCrearAdmin" class="is-active">Crear administrador</button>
        </footer>
    </section>
</main>

<script>
    const form = document.getElementById('formularioAdmin');
    const mensaje = document.getElementById('mensajeAdmin');
    const boton = document.getElementById('botonCrearAdmin');

    function validar() {
        if (form.nombre.value.trim() === '' || form.apellido.value.trim() === '') return 'Ingresá nombre y apellido.';
        if (!/^\d{7,8}$/.test(form.dni.value.trim())) return 'El DNI debe tener 7 u 8 números.';
        if (form.fecha_nacimiento.value === '') return 'Ingresá la fecha de nacimiento.';
        if (!/^[\d\s+()-]{6,20}$/.test(form.telefono.value.trim())) return 'El teléfono no es válido.';
        if (!/^\S+@\S+\.\S+$/.test(form.correo.value.trim())) return 'El correo no es válido.';
        const clave = form.contrasena.value;
        if (clave.length < 8 || clave.length > 14) return 'La contraseña debe tener entre 8 y 14 caracteres.';
        if (clave !== form.repetir_contrasena.value) return 'Las contraseñas no coinciden.';
        return '';
    }

    form.addEventListener('submit', function (evento) {
        evento.preventDefault();
        mensaje.textContent = '';

        const error = validar();
        if (error) {
            mensaje.textContent = error;
            mensaje.style.color = '#c0392b';
            return;
        }

        boton.disabled = true;
        fetch('php/registro_admin.php', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nombre: form.nombre.value,
                apellido: form.apellido.value,
                dni: form.dni.value,
                fecha_nacimiento: form.fecha_nacimiento.value,
                telefono: form.telefono.value,
                email: form.correo.value,
                contrasena: form.contrasena.value
            })
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (datos) {
                return { estado: r.status, datos: datos };
            });
        }).then(function (res) {
            boton.disabled = false;
            if (res.datos.ok) {
                mensaje.textContent = 'Administrador creado. Ya podés iniciar sesión.';
                mensaje.style.color = 'var(--gold-600)';
                form.reset();
                return;
            }
            if (res.estado === 401 || res.estado === 403) {
                mensaje.textContent = 'Ya existe un administrador. Iniciá sesión como administrador para crear otro.';
            } else {
                mensaje.textContent = res.datos.mensaje || 'No se pudo crear el administrador.';
            }
            mensaje.style.color = '#c0392b';
        });
    });
</script>

</body>
</html>
